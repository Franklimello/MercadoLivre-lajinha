# Template: replace PROJECT_ID, REGION, REPOSITORY, IMAGE_TAG and FRONTEND_HOST.
# Provision the named Secret Manager secrets and grant the runtime service account
# access before deployment. No credentials belong in this file.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mercado-livre-lajinha-api
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        # Socket.IO rooms and rate limiting are currently per instance.
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/sessionAffinity: "true"
    spec:
      serviceAccountName: mercado-lajinha-runtime@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 40
      # WebSocket clients reconnect after Cloud Run's request timeout.
      timeoutSeconds: 3600
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/mercado-lajinha-api:IMAGE_TAG
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: production
            # PORT is reserved: Cloud Run injects it from containerPort.
            - name: ALLOW_INSECURE_DEV_AUTH
              value: "false"
            - name: FRONTEND_URL
              value: https://FRONTEND_HOST
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mercado-lajinha-database-url
                  key: "1"
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: mercado-lajinha-direct-url
                  key: "1"
            - name: FIREBASE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: mercado-lajinha-firebase-project-id
                  key: "1"
            - name: FIREBASE_CLIENT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: mercado-lajinha-firebase-client-email
                  key: "1"
            - name: FIREBASE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mercado-lajinha-firebase-private-key
                  key: "1"
            - name: IMAGEKIT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: mercado-lajinha-imagekit-public-key
                  key: "1"
            - name: IMAGEKIT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mercado-lajinha-imagekit-private-key
                  key: "1"
            - name: IMAGEKIT_URL_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: mercado-lajinha-imagekit-url-endpoint
                  key: "1"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 48
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
  traffic:
    - latestRevision: true
      percent: 100
